defaults:
  - /prior@training_prior: crdm_single_uniform
  - /prior@recovery_prior: crdm_informed

sampler:
  _target_: confrdm_jax.simulators.sample_conditional_crdm_single
  dt: 0.004
  t_max: 4.0

test_sampler:
  _target_: confrdm_jax.simulators.sample_conditional_crdm_condition
  _partial_: true
  dt: 0.001
  t_max: 4.0

likelihood_factory_approx:
  _target_: confrdm_jax.likelihoods.create_crdm_likelihood_factory_approx
  _partial_: true
  # Censoring horizon, so `rt = -1.0` sentinels are scored by log S(t_max)
  # rather than taking the invalid-RT penalty.  Interpolated from the sampler
  # that produces the data, so the two cannot drift apart.
  t_max: ${model.test_sampler.t_max}

run_reference_recovery: false

num_bins: 4
num_mid: 64
num_params: 5

hierarchical:
  num_params: 7
  param_names: ["v_c_intercept", "v_c_slope", "amp", "tau", "s_true", "b", "t0"]
  prior_factory:
    _target_: confrdm_jax.simulators.create_hierarchical_crdm_prior_lkj_mvn
    _partial_: true
  test_sampler:
    _target_: confrdm_jax.simulators.sample_conditional_crdm_hierarchical_lkj_mvn
    _partial_: true
    dt: 0.001
    t_max: 4.0
  likelihood_factory_approx:
    _target_: confrdm_jax.likelihoods.create_crdm_hierarchical_likelihood_factory_approx
    _partial_: true
    t_max: ${model.hierarchical.test_sampler.t_max}
  prior:
    lkj_concentration: 2.0
    # See conf_jax/model/rdm.yaml for the rationale: concentration is the tail
    # index of the between-subject SD s, and at 4 it is heavy enough to push
    # subject parameters far outside the box the flow was trained on.
    # inverse_gamma_scale is otherwise scaled x4 alongside the concentration so
    # the median of s is unchanged.
    #
    # The two entries that were 0.8 rather than 0.4 -- v_c_slope (index 1) and
    # amp (index 2) -- are the exceptions.  x4 would put both at 3.2, twice
    # every other entry, and that width is what kept CRDM outside the flow's
    # support after the rest of the fix:
    #
    #   v_c_slope 3.2 -> v_c_true reached 11.5 against the flow's limit of 8
    #                    (v_c_true = v_c_intercept + v_c_slope, so the widths add)
    #   amp       3.2 -> amp reached 1.30 against its limit of 1.0
    #
    # Held to 2.0 and 2.5, which brings every flow input fully inside the box.
    # Unlike the x4 entries these are NOT median-preserving: they narrow the
    # between-subject SD of v_c_slope from a median of 0.22 to 0.14 and of amp
    # from 0.22 to 0.17 -- a substantive claim that people differ less in
    # conflict sensitivity and pulse amplitude than the x4 rule would imply.
    inverse_gamma_concentration: 15.0
    inverse_gamma_scale:    [1.6, 2.0, 2.5, 1.6, 1.6, 1.6, 1.0]
    # mu_loc[1] = 0.92 puts the median of v_c_slope at exp(0.92) = 2.51.  The
    # marginal median of a subject parameter is exactly exp(mu_loc), since
    # log(theta) is symmetric about mu_loc once mu and z are integrated out.
    # Raising it also shifts v_c_true = v_c_intercept + v_c_slope, whose median
    # goes 2.78 -> 3.64 and max 6.88 -> 9.88; v_c_max in the training prior is
    # raised to 14.0 to keep the headroom that move would otherwise consume.
    mu_loc:                 [0.1, 0.92, -1.4, -2.2, 0.0, 0.0, -1.2]
    mu_scale:               [0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.1]
