defaults:
  - /prior@training_prior: wald_uniform
  - /prior@recovery_prior: rdm_informed

# Parameterization, from confrdm_jax.specs. It is the single source of truth for the
# parameter vector's names, order and links — both recovery scripts read them from here
# rather than from a duplicated list.
spec: rdm

# The flow's conditioning columns, in the order it is trained on. Written to the checkpoint
# sidecar and checked on load: a reordered context of the same width would otherwise load
# without complaint and produce silently wrong densities. `t0` is absent on purpose — the
# flow models decision times, so `t0` is a pure location shift applied by the race.
context_names: [v, s, b]

# The box the flow was trained on, per flow input, interpolated from the training prior so
# the two cannot disagree. The neural likelihoods clip the flow's inputs to it: outside the
# box the flow extrapolates, with gradient spikes and flat plateaus that collapse step-size
# adaptation, while a clipped input sees the density at the box edge. Inside the box nothing
# changes. See confrdm_jax.likelihoods._flow_accumulator and CONFRDM_JAX.md §16.
#
# Only valid for a conditioner trained on *this* training prior. Recovering with a
# checkpoint trained on a different box needs the matching model.training_prior overrides.
flow_context_bounds:
  v: ['${model.training_prior.v_min}', '${model.training_prior.v_max}']
  s: ['${model.training_prior.s_min}', '${model.training_prior.s_max}']
  b: ['${model.training_prior.b_min}', '${model.training_prior.b_max}']

sampler:
  _target_: confrdm_jax.simulators.sample_conditional_wald

test_sampler:
  _target_: confrdm_jax.simulators.sample_conditional_rdm
  _partial_: true

likelihood_factory_approx:
  _target_: confrdm_jax.likelihoods.create_rdm_likelihood_factory_approx
  _partial_: true
  context_bounds: ${model.flow_context_bounds}

likelihood_factory_ref:
  _target_: confrdm_jax.likelihoods.create_rdm_two_accumulators_likelihood
  _partial_: true

run_reference_recovery: true

num_bins: 4
num_mid: 64

hierarchical:
  prior_factory:
    _target_: confrdm_jax.priors.create_hierarchical_rdm_prior_lkj_mvn
    _partial_: true
  test_sampler:
    _target_: confrdm_jax.simulators.sample_conditional_rdm_hierarchical_lkj_mvn
    _partial_: true
  likelihood_factory_approx:
    _target_: confrdm_jax.likelihoods.create_rdm_hierarchical_likelihood_factory_approx
    _partial_: true
    context_bounds: ${model.flow_context_bounds}
  likelihood_factory_ref:
    _target_: confrdm_jax.likelihoods.create_rdm_hierarchical_likelihood
    _partial_: true
  prior:
    lkj_concentration: 2.0
    # concentration is the tail index of the between-subject SD s: at the
    # previous value of 4, rare populations drew s ~ 1 in log space and so
    # subject parameters up to v=2.4e6 / s=274 / b=25 -- far outside the
    # [0,8]x[0,5]x[0,5] box the flow is trained on (conf_jax/prior/wald_uniform.yaml),
    # where its log-density has gradient spikes and flat plateaus that collapse
    # NUTS step-size adaptation and freeze the SMC particle cloud.  15 bounds
    # the worst case to v=4.98 / s=4.08 / b=3.38; inverse_gamma_scale is scaled
    # x4 alongside it so the *median* of s is unchanged at 0.11.
    inverse_gamma_concentration: 15.0
    # One entry per parameter, in `spec` order: [v_intercept, v_slope, s_true, b, t0].
    inverse_gamma_scale:    [1.6, 1.6, 1.6, 1.6, 1.0]
    mu_loc:                 [0.1, 0.3, 0.4, 0.4, -1.2]
    # 0.15 rather than 0.25: mu_loc puts the median of s_true and b at 1.49
    # against a box edge of 3.0, so there is only 2x headroom for the
    # population mean to move before subjects leave the flow's support.
    mu_scale:               [0.15, 0.15, 0.15, 0.15, 0.1]
