# @package _global_

hydra:
  run:
    dir: outputs/compare_densities
  job:
    chdir: False

# See conf_jax/config.yaml. `auto` here rather than failing hard: this script is often run
# interactively on a laptop, where there is no accelerator to require.
device: auto
require_device: true

# Conditioner architecture (depth, affine layout, spline settings, log-input scaling, bins,
# width) is read from each checkpoint's sidecar, so only the paths are configured here. They
# point at the final run's flows through the `run_dir` resolver (confrdm_jax.runs): the CRDM
# flow at dt = 0.0005 is the run itself, the coarser ones its model.sampler.dt subdirectories.

wald:
  # null skips the Wald comparison
  conditioner_path: "${run_dir:rdm}/conditioner"
  param_values:
    v: [0.5, 1.5, 2.5, 4.0, 8.0]
    s: [0.5, 1.0, 3.0]
    b: [0.5, 1.0, 3.0]

crdm:
  # Accuracy is measured against the Volterra solver at this step for every flow; timing
  # uses each flow's own dt. See scripts/compare_neural_densities.py.
  reference_dt: 0.0005
  conditioners:  # list of {dt: float, path: str}
    - dt: 0.05
      path: "${run_dir:crdm,'model.sampler.dt=0.05'}/conditioner"
    - dt: 0.005
      path: "${run_dir:crdm,'model.sampler.dt=0.005'}/conditioner"
    - dt: 0.0005
      path: "${run_dir:crdm}/conditioner"
  param_values:
    v: [0.5, 1.5, 2.5, 4.0, 8.0]
    s: [0.5, 1.0, 3.0]
    b: [0.5, 1.0, 3.0]
    amp: [0.1, 0.3, 0.5]
    tau: [0.05, 0.1, 0.15, 0.3]

evaluation:
  chunk_size: 1

output_path: outputs/compare_densities/density_comparison.nc
