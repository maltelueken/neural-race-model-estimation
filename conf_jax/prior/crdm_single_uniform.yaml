# Training prior for the CRDM flow -- the box the conditioner is fitted over.
# See conf_jax/prior/wald_uniform.yaml for why this is not an inference prior
# and why the box has to cover more than the bulk of the hierarchical prior.
#
# Against the hierarchical prior in conf_jax/model/crdm.yaml, the old box left
# almost no margin on four of its five axes -- v_c reached 6.88 of 8.0, amp
# 0.90 of 1.0, s_true 2.87 of 3.0 and b 2.32 of 3.0.  Nothing fell outside, but
# a warm-up trajectory only has to overshoot slightly to leave support.  The
# new limits give every axis at least ~1.4x headroom over the observed max.
# tau is untouched: it tops out at 0.27, so 1.0 is already 3.7x.
#
# Cost: the box grows 5.2x (72 -> 375) and censoring at t_max = 4.0 rises from
# 2.58% to 3.66% -- handled by the right-censored MLE.  Note the censoring rise
# comes from s_max/b_max, not v_c_max: raising v_c_max speeds crossings and so
# *lowers* censoring (a v_c_max of 8.0 with the same s/b gives 4.74%).
# Scale train_steps up for the extra volume.
_target_: confrdm_jax.simulators.create_crdm_single_prior_uniform
v_c_min: 0.0
v_c_max: 10.0
amp_min: 0.0
amp_max: 1.5
tau_min: 0.0
tau_max: 1.0
s_min: 0.0
s_max: 5.0
b_min: 0.0
b_max: 5.0
