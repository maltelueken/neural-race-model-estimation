# Single-subject CRDM recovery prior.
#
# v_c_slope_loc = 2.5 puts the slope near the hierarchical prior's median of 2.51. This prior puts about 3% of datasets below the flow's
# training box -- tau < 0.01 in 1.4%, b < 0.25 in 1.4%, s_true < 0.25 in 0.4% -- where the
# flow's inputs are clamped, so recovery for those few datasets is not exact.
_target_: confrdm_jax.priors.create_crdm_prior_informed
v_c_intercept_loc: 1.0
v_c_intercept_scale: 0.25
v_c_slope_loc: 2.5
v_c_slope_scale: 0.5
amp_loc: 0.3
amp_scale: 0.05
tau_loc: 0.1
tau_scale: 0.05
s_true_shape: 8.0
s_true_scale: 0.1
b_shape: 7.0
b_scale: 0.1
t0_loc: 0.3
t0_scale: 0.2
