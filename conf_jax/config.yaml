# @package _global_

defaults:
 - model: rdm

hydra:
  run:
    dir: outputs/${hydra:runtime.choices.model}/${hydra.job.override_dirname}
  job:
    chdir: True
    config:
      override_dirname:
        item_sep: "/"
        exclude_keys:
          - model
    env_set:
      JAX_ENABLE_X64: true
  job_logging:
    handlers:
      file:
        mode: w

train_steps: 50000
train_batch_size: 64
train_num_obs: 200
train_seed: 2026

learning_rate: 5e-3

mcmc:
  num_warmup: 1000
  num_sampling: 1000


