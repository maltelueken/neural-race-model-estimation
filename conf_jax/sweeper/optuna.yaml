# @package _global_

defaults:
  - override /hydra/sweeper: optuna

hydra:
  sweeper:
    direction: minimize
    study_name: ${hydra.runtime.choices.model}-${hydra.job.override_dirname}
    storage: "sqlite:///multirun/multirun.db"
    n_trials: 50
    n_jobs: 1
    model.num_bins: range(2, 20)
    model.num_mid: choice(8, 16, 32, 64, 128, 256)
