# @package _global_

defaults:
- override /approximator/inference_network: coupling_flow

depth: 6
transform: affine
permutation: random
use_actnorm: true
base_distribution: normal
  # _target_: bayesflow.distributions.DiagonalStudentT
  # df: 50

mlp_depth: 2
mlp_width: 7 # 2^7 = 128
mlp_residual: false
mlp_dropout: 0.0
mlp_spectral_normalization: false

hydra:
  sweeper:
    params:
      mlp_depth: range(2, 12)
      mlp_width: range(6, 10)
      approximator.inference_network.transform: choice(affine, spline, interleaved)
